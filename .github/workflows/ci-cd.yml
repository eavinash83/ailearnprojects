# CI on every push and pull request; on pushes to main (and manual runs) it then deploys to Render and smoke-tests the result.
#
# One-time setup (Settings > Secrets and variables > Actions > New repository secret):
#   RENDER_API_KEY      Render > Account Settings > API Keys
#   RENDER_SERVICE_ID   srv-... (printed by `npm run render:create`, or in the service URL in the Render dashboard)
# Then switch Render's own push-to-deploy off so deploys happen only here, after CI is green:
#   npm run render:autodeploy -- off
#
# The functional tests (api-tests, e2e-tests) need one more secret, the Neon TEST branch (never the production database):
#   TEST_DATABASE_URL   connection string of the Neon branch used for tests
# Runs tag their data with a per-run id, so overlapping runs sharing that branch do not interfere. deploy needs all jobs to pass.
name: CI/CD

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Deploy this commit SHA instead of the branch head (roll back / pin). Leave empty for HEAD.'
        required: false

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false # never cancel a deploy half-way

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Syntax check server and shared code
        run: |
          for f in server/*.js shared/*.js scripts/*.mjs scripts/lib/*.mjs tests/api/*.js tests/api/helpers/*.js tests/e2e/*.js; do node --check "$f"; done
      - run: npm run build
      - name: Docker image builds
        run: docker build -t app-ci .

  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      RUN_ID: ci-api-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check test database secret
        run: |
          if [ -z "$TEST_DATABASE_URL" ]; then
            echo "::error::Add the Neon TEST branch connection string as repository secret TEST_DATABASE_URL (see the header of this file)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: API tests
        run: npm run test:api

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      RUN_ID: ci-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check test database secret
        run: |
          if [ -z "$TEST_DATABASE_URL" ]; then
            echo "::error::Add the Neon TEST branch connection string as repository secret TEST_DATABASE_URL (see the header of this file)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright and Chromium
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: E2E tests (builds the app first)
        run: npm run test:e2e
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7

  deploy:
    needs: [verify, api-tests, e2e-tests]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production # add required reviewers on this environment if you want a manual approval gate
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      COMMIT_ID: ${{ github.event.inputs.commit }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "::error::Add RENDER_API_KEY and RENDER_SERVICE_ID as repository secrets (see the header of this file)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deploy to Render and smoke-test
        run: node scripts/render.mjs deploy
